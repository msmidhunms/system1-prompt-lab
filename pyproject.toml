[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "system1-prompt-lab"
version = "0.1.0"
description = "Workbench for small, fast System 1 classifiers: golden datasets, evaluation, model comparison and an LLM-driven prompt optimizer"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Midhun M S"}
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "black>=23.11.0",
    "isort>=5.12.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
